description: Thread (thread.com) was a UK-based fashion technology company that combined AI with human
  expert stylists to deliver personalized clothing recommendations for men and women. Founded by Kieran
  O'Neill and Ben Phillips and backed by Andreessen Horowitz (a16z) and Balderton Capital, Thread's brand,
  technology and data were acquired by Marks & Spencer. The company subsequently entered administration
  and has ceased trading; its site now serves only a shutdown notice. Enrichment found no public API,
  developer portal, documentation, or event surface. This profile is retained as a network record of a
  defunct portfolio company.
